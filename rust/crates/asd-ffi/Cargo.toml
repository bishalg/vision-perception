[package]
name = "asd-ffi"
description = "UniFFI bindings over the ASD core for Swift and Kotlin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# `lib` for the Rust tests, `staticlib` for the Apple xcframework (FFI-2), `cdylib` for
# Android (`libasd_ffi.so`, loaded by JNA) and the host library of the Kotlin JVM tests
# (AND-1, scripts/build_asd_android.sh).
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
# `cargo run -p asd-ffi --features cli --bin uniffi-bindgen -- generate ...`
# (scripts/build_asd_xcframework.sh). Feature-gated so the mobile library never links it.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
asd-core.workspace = true
asd-contract.workspace = true
asd-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi = "0.32"
