[package]
name = "asd-export"
description = "ASD export bridge: every outbound format (CSV, XLSX, PDF, FHIR R4, HL7 v2.5.1), de-identification, consent policy, code tables and watermarks (ADR-0008, XC-1..8)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# XC-1: pure crate (no I/O, no async). `pdf` and `xlsx` are on in the backend; the iOS
# static library (future FFI use) builds with `--no-default-features`.
[features]
default = ["pdf", "xlsx", "parquet"]
# PDF engine (and, from WP-I.5, embedded font data).
pdf = ["dep:pdf-writer"]
# XLSX writer (WP-I.2).
xlsx = ["dep:rust_xlsxwriter"]
# Parquet ML datasets (WP-B.9).
parquet = ["dep:parquet"]

[dependencies]
asd-core.workspace = true
# The stored session record (`sessions.summary`) is `asd_contract::session_v1_6::GazeSessionRecord`;
# `ExportRecord` reuses the `/v1` session, clip and metric-row types.
asd-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Manifest hashes (SHA-256) and the de-identification pseudonyms (HMAC-SHA256, XC-4).
sha2.workspace = true
hmac = "0.12"
# FHIR timestamps: RFC 3339 in, ISO 8601 whole seconds UTC out (as ISO8601DateFormatter).
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Org time zones (IANA, NOTE-7): HL7 `TS`, printed and spreadsheet times (trap 11).
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# Name-based (v5, SHA-1) UUIDs for every bundle fullUrl, as FHIRBundleBuilder.uuid.
uuid = { version = "1", features = ["v5"] }
# DocumentReference attachment: base64 data and SHA-1 hash (FHIR Attachment.hash); HL7 ED.
base64 = "0.23"
sha1_smol = "1"
# Multi-table CSV exports are a ZIP (CSV-3). Deflate only, pure-Rust backend; no
# encryption, no other codecs, no clock (timestamps are fixed for XC-8).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Not used directly: selects flate2's pure-Rust backend (miniz_oxide), which zip's
# `deflate-flate2` feature leaves unset (flate2 fails to build without a backend).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Low-level, deterministic PDF writer (MIT OR Apache-2.0): base-14 fonts, nothing embedded.
pdf-writer = { version = "0.15", optional = true }
# XLSX-1 (MIT OR Apache-2.0).
rust_xlsxwriter = { version = "0.102", optional = true, default-features = false }
# WP-B.9 dataset files (Apache-2.0, Apache Arrow project). No default features: no Arrow,
# no compression codecs (datasets are written uncompressed), only the low-level writer.
parquet = { version = "60", optional = true, default-features = false }
# `case-package-v1.json`, the case package manifest schema (WP-I.12, SHR-2); the version
# asd-contract already uses (MIT).
schemars = "1"

[dev-dependencies]
# JSON Schema validation of the case package manifest (WP-I.12).
asd-contract = { workspace = true, features = ["validate"] }
# Reads the XLSX back in tests (WP-I.2; MIT), so no binary golden is committed.
calamine = { version = "0.38", default-features = false }
# Reads the Parquet dataset back in tests (WP-B.9).
bytes = "1"

[[test]]
name = "pdf_report"
required-features = ["pdf"]

[[test]]
name = "not_scored"
required-features = ["pdf"]

[[test]]
name = "xlsx"
required-features = ["xlsx"]

[[test]]
name = "dataset"
required-features = ["parquet"]
