[package]
name = "asd-report"
description = "ASD report and interop exports: FHIR R4 bundle and the observation diary PDF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
asd-core.workspace = true
# The stored session record (`sessions.summary`) is `asd_contract::session_v1_6::GazeSessionRecord`.
asd-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# FHIR timestamps: RFC 3339 in, ISO 8601 whole seconds UTC out (as ISO8601DateFormatter).
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Name-based (v5, SHA-1) UUIDs for every bundle fullUrl, as FHIRBundleBuilder.uuid.
uuid = { version = "1", features = ["v5"] }
# DocumentReference attachment: base64 data and SHA-1 hash (FHIR Attachment.hash).
base64 = "0.22"
sha1_smol = "1"
# Low-level, deterministic PDF writer (MIT OR Apache-2.0): base-14 fonts, nothing embedded.
pdf-writer = "0.15"
