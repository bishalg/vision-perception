[package]
name = "asd-cli"
description = "ASD command line: schema, bundle, synth, norms"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "asd-cli"
path = "src/main.rs"

[dependencies]
# `synth` feature: `asd-cli synth` (WP-R.4, cmd/synth.rs).
asd-core = { workspace = true, features = ["synth"] }
asd-contract = { workspace = true, features = ["validate"] }
asd-sync.workspace = true
serde_json.workspace = true
# SHA-256 of bench logs in `gaze bench-report` (BEN-8, WP-G.5).
sha2.workspace = true
# Key generation for `bundle keygen` (WP-R.3).
getrandom = "0.4"
