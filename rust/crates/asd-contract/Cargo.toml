[package]
name = "asd-contract"
description = "ASD wire contracts, JSON Schema export and bundle signing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# JSON Schema validation of documents (`schema::validate*`). Off by default so the mobile
# static library (asd-ffi) does not carry a validator; asd-cli and the backend enable it.
validate = ["dep:jsonschema"]

[dependencies]
asd-core.workspace = true
serde.workspace = true
# float_roundtrip: exact float parsing; without it a verifier can re-parse a signed
# number one ULP off and reject a valid bundle signature (tests/signing.rs).
serde_json = { workspace = true, features = ["float_roundtrip"] }
# RFC 8785 number formatting (ECMAScript); canonicalisation itself is src/jcs.rs.
ryu-js = "0.2"
thiserror.workspace = true
schemars = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast", "pkcs8", "pem"] }
base64 = "0.22"
sha2.workspace = true
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"], optional = true }

[dev-dependencies]
# Self dev-dependency: the integration tests always exercise the `validate` feature.
asd-contract = { path = ".", features = ["validate"] }
