[package]
name = "asd-backend"
description = "ASD backend service (Axum, sqlx, Postgres)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "asd-backend"
path = "src/main.rs"

[dependencies]
asd-core.workspace = true
# `validate`: POST /v1/sessions checks the body against the exported session schema (ING-1).
asd-contract = { workspace = true, features = ["validate"] }
asd-sync.workspace = true
# WP-B.8: server-side report PDF and FHIR R4 bundle (one implementation with every platform).
asd-export.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Idempotency request hashes and the deterministic random-audit draw (ING-1, ING-3).
sha2.workspace = true
# Opaque list cursors (base64url, API conventions).
base64 = "0.22"

async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
# No default features: the default `rustls` feature is the legacy hyper 0.14 / rustls 0.21
# client (RUSTSEC-2026-0258, RUSTSEC-2026-0346). `default-https-client` is hyper 1 + rustls 0.23.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "http-1x",
    "rt-tokio",
] }
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
http = "1"
regex = "1"
# No TLS feature yet: compose talks to Postgres on a private network. WP-B.7 (RDS) adds
# `tls-rustls-ring-native-roots` (webpki-roots is CDLA-Permissive-2.0, not on the allow-list).
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "request-id", "timeout", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
uuid = { version = "1", features = ["serde", "v4"] }
# ---- auth (WP-B.2). Also uses sha2 (token hashes) and base64 (token encoding) above.
# AUTH-1: Argon2id; salts come from getrandom, so no `rand` feature.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
# AUTH-2: the JWT key is Ed25519 PKCS#8 (same format as `asd-cli bundle keygen`, trap 11).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
getrandom = "0.4"
# EdDSA access tokens. aws-lc-rs is already in the graph (aws-sdk-s3); `rust_crypto` would
# pull `rsa` (RUSTSEC-2023-0071) and `use_pem` is not needed (keys are parsed above).
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
# WP-B.5 tests drive norm runs with the deterministic synthetic session generator.
asd-core = { workspace = true, features = ["synth"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
