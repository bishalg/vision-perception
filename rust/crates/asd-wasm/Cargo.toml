[package]
name = "asd-wasm"
description = "WebAssembly bindings over the ASD core for the web console (sandbox re-score)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# `cdylib` for wasm-bindgen (scripts/build_asd_wasm.sh), `rlib` for the native tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
asd-core.workspace = true
asd-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.100"

[dev-dependencies]
# The parity tests replay the synthetic research logs (`synth_tracking`) and sessions.
asd-core = { workspace = true, features = ["synth"] }
sha2.workspace = true
wasm-bindgen-test = "0.3"
