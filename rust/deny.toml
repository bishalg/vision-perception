# cargo-deny policy (spec WS-3, GATE-5). Allow-list mirrors docs/license_policy.md.
[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
]
exceptions = [
    # OpenSSL licence only for the crypto crates that carry it.
    { allow = ["OpenSSL"], crate = "aws-lc-sys" },
    { allow = ["OpenSSL"], crate = "ring" },
    # MPL-2.0 (file-level copyleft, yellow list) only for UniFFI.
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_build" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_checksum_derive" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_testing" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # asd-core must stay I/O free (WS-2); also checked by review.
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml is unmaintained (no fix exists). It reaches the graph only through
    # askama -> uniffi_bindgen, i.e. the `asd-ffi/cli` feature that runs the binding
    # generator at build time (scripts/build_asd_xcframework.sh); it is never linked into
    # the app library. Drop this when UniFFI moves askama off basic-toml.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen (asd-ffi/cli)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
