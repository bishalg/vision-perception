# owner: WP-B.18 (DPL-1..5, ADR-0011 D8)
#
# The production stack for one clinic server. Install with `sudo ./install.sh`; do not run
# compose by hand unless README.md tells you to. Every setting comes from `.env` (written
# by install.sh, mode 0600, never committed); `.env.example` documents each one.
#
#   internet --443--> caddy --> console:3000   https://<DOMAIN>
#                          \--> api:8000       https://api.<DOMAIN>  (iPads, device plane)
#   api, worker  --asd_app--> postgres   (least privilege, threat-model F10)
#   migrate, backup --owner--> postgres  (schema owner; runs once / nightly)
#
# Only caddy publishes host ports. postgres, minio and the API metrics listener are on the
# compose network only (DPL-3, HIP-6). `rust/docker-compose.yml` stays the dev/demo stack.

name: asd-clinic

x-backend-image: &backend-image
  image: ${ASD_IMAGE_PREFIX:-}asd-backend:${ASD_VERSION:?ASD_VERSION is not set in .env}
  build:
    context: ../../rust
    dockerfile: Dockerfile

x-backend-env: &backend-env
  RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=info}
  BLOB_MODE: proxy
  ASD_BLOB_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:-curv-asd-sessions}
  S3_REGION: us-east-1
  S3_ENDPOINT_URL: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:?}
  AWS_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:?}
  ASD_DATA_KEK: ${ASD_DATA_KEK:?}

x-app-env: &app-env
  <<: *backend-env
  # asd_app: DML only, append-only audit_log (migration 0002). Never the owner role.
  DATABASE_URL: postgres://asd_app:${ASD_APP_DB_PASSWORD:?}@postgres:5432/asd
  ASD_JWT_SIGNING_KEY: ${ASD_JWT_SIGNING_KEY:?}
  ASD_BUNDLE_SIGNING_KEY: ${ASD_BUNDLE_SIGNING_KEY:?}
  # Caddy is the only way in; it sets X-Forwarded-For (threat-model F11).
  ASD_TRUST_PROXY_HEADERS: "true"
  ASD_CONSOLE_ORIGIN: https://${DOMAIN:?}
  ASD_PUBLIC_BASE_URL: https://api.${DOMAIN:?}
  ASD_ALLOW_SYNTHETIC: "false"

x-owner-db: &owner-db
  DATABASE_URL: postgres://asd:${POSTGRES_PASSWORD:?}@postgres:5432/asd

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      # PUBLISH_ADDR is 127.0.0.1 in tunnel mode: then nothing but cloudflared can reach
      # Caddy, so a client cannot forge Cf-Connecting-Ip by bypassing Cloudflare.
      - "${PUBLISH_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLISH_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${PUBLISH_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      TLS_MODE: ${TLS_MODE:?}
      SITE_SCHEME: ${SITE_SCHEME:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - console

  postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: asd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: asd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asd -d asd"]
      interval: 5s
      timeout: 5s
      retries: 30

  # MinIO no longer publishes images (minio/minio and minio/mc are gone from Docker Hub,
  # quay.io needs a login since 2025). Bitnami's frozen builds of the same MinIO releases
  # (bitnamilegacy, non-root uid 1001, data in /bitnami/minio/data) are used instead.
  minio:
    image: bitnamilegacy/minio:2024.10.13-debian-12-r1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Bucket (private) and the API's own MinIO user (readwrite), so the root credentials
  # never reach the API. Idempotent.
  minio-init:
    image: bitnamilegacy/minio-client:2024.10.8-debian-12-r1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-curv-asd-sessions}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET" >/dev/null &&
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" >/dev/null &&
        (mc admin policy attach local readwrite --user "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1 || true) &&
        echo "minio-init: bucket and app user ready"
    restart: "no"

  migrate:
    <<: *backend-image
    command: ["migrate"]
    environment:
      <<: [*backend-env, *owner-db]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-image
    command: ["serve"]
    restart: unless-stopped
    environment:
      <<: *app-env
      # Prometheus scrape listener on the compose network only (never published).
      ASD_METRICS_BIND_ADDR: 0.0.0.0:9100
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *backend-image
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  console:
    image: ${ASD_IMAGE_PREFIX:-}asd-console:${ASD_VERSION:?}
    build:
      context: ../../apps/curv_console
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CURV_API_MODE: live
      CURV_API_BASE_URL: http://api:8000
      CURV_COOKIE_SECURE: "true"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      - api

  # Nightly backup and restore helpers (DPL-6..8). Run by backup.sh / restore.sh /
  # restore-drill.sh through `docker compose run`; never a long-running service.
  backup:
    image: ${ASD_IMAGE_PREFIX:-}asd-backup:${ASD_VERSION:?}
    build:
      context: .
      dockerfile: backup.Dockerfile
      # The backend image by name, not `service:migrate`: with a service context compose
      # rebuilds the backend from ../../rust on every `run backup`, which a release install
      # (pulled images, no source) cannot do. Build the backend first (install.sh does).
      additional_contexts:
        backend: docker-image://${ASD_IMAGE_PREFIX:-}asd-backend:${ASD_VERSION:?}
    profiles: ["backup"]
    command: ["/opt/asd/backup.sh", "--inside"]
    environment:
      <<: [*backend-env, *owner-db]
      PGHOST: postgres
      PGUSER: asd
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: asd
      ASD_VERSION: ${ASD_VERSION:?}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG: /state/rclone.conf
    volumes:
      - ${ASD_STATE_DIR:-/var/lib/asd}:/state
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  # TLS_MODE=tunnel: Cloudflare Tunnel to caddy:80 (no inbound ports needed).
  tunnel:
    image: cloudflare/cloudflared:2024.10.0
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
