<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palm line annotator</title>
<style>
:root{
  --bg:#0b0b0d;--panel:#141417;--line:#2a2a31;--txt:#f4f4f5;--mut:#a1a1aa;
  --heart:#F43F5E;--head:#06B6D4;--life:#10B981;--fate:#8B5CF6;--mask:#fbbf24;
  --blue:#60a5fa;--radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);background:#101013}
header h1{font-size:15px;margin:0;font-weight:600}
header h1 small{display:block;font-size:11px;color:var(--mut);font-weight:400;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;
  padding:7px 12px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--blue)}button.primary{background:#2563eb;border-color:#2563eb}
button.on{outline:2px solid var(--blue);outline-offset:1px}
button.tag-heart.on{outline-color:var(--heart)}button.tag-head.on{outline-color:var(--head)}
button.tag-life.on{outline-color:var(--life)}button.tag-fate.on{outline-color:var(--fate)}
button.tag-mask.on{outline-color:var(--mask)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
main{flex:1;display:grid;grid-template-columns:220px 1fr 240px;min-height:0}
@media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}}
aside,section.side{border-right:1px solid var(--line);overflow:auto;background:#101013;padding:8px}
section.side{border-right:none;border-left:1px solid var(--line)}
.list-item{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 10px;border-radius:8px;
  border:1px solid transparent;background:transparent;color:var(--txt);font-size:12px}
.list-item:hover{background:#1a1a1f}.list-item.active{border-color:var(--blue);background:#1a2340}
.badge{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);margin-left:4px}
.badge.amber{color:#fbbf24;border-color:#fbbf24}.badge.green{color:#34d399;border-color:#34d399}
.badge.grey{color:var(--mut)}
.stage-wrap{display:flex;align-items:center;justify-content:center;padding:12px;min-height:0;overflow:auto;background:#050506}
canvas{max-width:100%;max-height:calc(100vh - 120px);cursor:crosshair;border-radius:8px;background:#000;
  box-shadow:0 0 0 1px var(--line)}
.side h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:12px 8px 6px}
.stat{font-size:12px;padding:4px 8px;color:var(--mut)}
.stat b{color:var(--txt);font-weight:600}
.help{font-size:11px;color:var(--mut);line-height:1.5;padding:8px;border-top:1px solid var(--line);margin-top:12px}
.help kbd{background:#26262b;border-radius:4px;padding:1px 5px;font-size:10px}
.status{font-size:12px;color:var(--mut)}.status.ok{color:#34d399}.status.err{color:#f87171}
</style>
</head>
<body>
<header>
  <h1>Palm line annotator<small>Color-tagged polylines → <code>*_USER_CORRECTED.json</code></small></h1>
  <div class="row" id="tags">
    <button type="button" class="tag-heart on" data-tag="heart"><span class="dot" style="background:var(--heart)"></span>1 Heart</button>
    <button type="button" class="tag-head" data-tag="head"><span class="dot" style="background:var(--head)"></span>2 Head</button>
    <button type="button" class="tag-life" data-tag="life"><span class="dot" style="background:var(--life)"></span>3 Life</button>
    <button type="button" class="tag-fate" data-tag="fate"><span class="dot" style="background:var(--fate)"></span>4 Fate</button>
    <button type="button" class="tag-mask" data-tag="hand_mask"><span class="dot" style="background:var(--mask)"></span>5 Mask</button>
  </div>
  <div class="row">
    <button type="button" id="btnAbsent" title="Mark active line absent (A)">Absent</button>
    <button type="button" id="btnUndo" title="Undo last point (Backspace)">Undo</button>
    <button type="button" id="btnClear" title="Clear active line">Clear</button>
    <button type="button" id="btnPrev" title="Previous (P)">Prev</button>
    <button type="button" id="btnNext" title="Next (N)">Next</button>
    <button type="button" class="primary" id="btnSave" title="Save reviewed (S)">Save</button>
    <span class="status" id="status"></span>
  </div>
</header>
<main>
  <aside id="gallery"></aside>
  <div class="stage-wrap"><canvas id="cv" width="800" height="800"></canvas></div>
  <section class="side">
    <h2>Active</h2>
    <div class="stat" id="stemInfo">—</div>
    <h2>Readout</h2>
    <div id="readout"></div>
    <h2>Overlays</h2>
    <div class="stat"><label><input type="checkbox" id="showImport" checked> imported / current (solid)</label></div>
    <div class="stat"><label><input type="checkbox" id="showEvidence" checked> auto evidence (dashed, dim)</label></div>
    <div class="help">
      <b>Keys</b><br>
      <kbd>1</kbd>–<kbd>4</kbd> line · <kbd>5</kbd> mask<br>
      Click = add vertex · drag handle = move<br>
      <kbd>Backspace</kbd> undo · <kbd>A</kbd> absent<br>
      <kbd>S</kbd> save · <kbd>N</kbd>/<kbd>P</kbd> next/prev<br>
      Empty line = absent. Save sets <code>reviewed:true</code>.
    </div>
  </section>
</main>
<script>
const COLORS = {heart:"#F43F5E", head:"#06B6D4", life:"#10B981", fate:"#8B5CF6", hand_mask:"#fbbf24"};
const LINES = ["heart","head","life","fate"];
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const state = {
  items: [],
  index: 0,
  tag: "heart",
  label: null,
  evidence: {},
  image: null,
  imageUrl: null,
  stem: null,
  drag: null, // {line, polyIdx, ptIdx}
  dirty: false,
};

function setStatus(msg, cls) {
  const el = document.getElementById("status");
  el.textContent = msg || "";
  el.className = "status " + (cls || "");
}

function activePolyKey() {
  return state.tag === "hand_mask" ? "hand_mask" : state.tag;
}

function ensurePoly(key) {
  if (!state.label[key]) state.label[key] = [];
  // We edit a single primary polyline per line for speed.
  if (state.label[key].length === 0) state.label[key].push([]);
  return state.label[key][0];
}

function arcLen(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i-1][0], dy = pts[i][1] - pts[i-1][1];
    s += Math.hypot(dx, dy);
  }
  return s;
}

function bbox(pts) {
  if (!pts.length) return null;
  let minX=1,minY=1,maxX=0,maxY=0;
  for (const [x,y] of pts) { minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x); maxY=Math.max(maxY,y); }
  return {minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY};
}

function updateReadout() {
  const el = document.getElementById("readout");
  const rows = [];
  for (const name of [...LINES, "hand_mask"]) {
    const polys = state.label?.[name] || [];
    const pts = polys[0] || [];
    const bb = bbox(pts);
    const color = COLORS[name];
    rows.push(`<div class="stat"><span class="dot" style="background:${color}"></span><b>${name}</b>
      · ${pts.length} pts · arc ${(arcLen(pts)*100).toFixed(1)}%
      ${bb ? `· box ${(bb.w*100).toFixed(1)}×${(bb.h*100).toFixed(1)}%` : "· absent"}</div>`);
  }
  el.innerHTML = rows.join("");
  const it = state.items[state.index];
  document.getElementById("stemInfo").innerHTML = it
    ? `<b>${it.stem}</b><br><span class="badge ${it.reviewed?"green":"amber"}">${it.reviewed?"reviewed":"needs review"}</span>
       <span class="badge grey">${it.collection}</span>${state.dirty?' <span class="badge amber">unsaved</span>':''}`
    : "—";
}

function renderGallery() {
  const g = document.getElementById("gallery");
  g.innerHTML = state.items.map((it, i) => {
    const badge = it.reviewed
      ? '<span class="badge green">reviewed</span>'
      : '<span class="badge amber">queue</span>';
    return `<button type="button" class="list-item ${i===state.index?"active":""}" data-i="${i}">
      ${it.stem}${badge}${it.has_evidence?' <span class="badge grey">auto</span>':''}</button>`;
  }).join("") || '<div class="stat">No images. Run <code>download_palm_labels.py</code> or drop photos into <code>data/samples/mobile_captures/</code>.</div>';
  g.querySelectorAll(".list-item").forEach(b => b.onclick = () => loadIndex(+b.dataset.i));
}

function imgToCanvas() {
  if (!state.image) return;
  const max = Math.min(window.innerWidth - 480, window.innerHeight - 140, 960);
  const scale = Math.min(max / state.image.naturalWidth, max / state.image.naturalHeight, 1);
  cv.width = Math.max(1, Math.round(state.image.naturalWidth * scale));
  cv.height = Math.max(1, Math.round(state.image.naturalHeight * scale));
}

function normFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  return [Math.max(0, Math.min(1, x)), Math.max(0, Math.min(1, y))];
}

function hitHandle(nx, ny, rad = 0.012) {
  if (!state.label) return null;
  for (const name of [...LINES, "hand_mask"]) {
    const polys = state.label[name] || [];
    for (let pi = 0; pi < polys.length; pi++) {
      const poly = polys[pi];
      for (let i = 0; i < poly.length; i++) {
        if (Math.hypot(poly[i][0]-nx, poly[i][1]-ny) <= rad) {
          return {line: name, polyIdx: pi, ptIdx: i};
        }
      }
    }
  }
  return null;
}

function drawPoly(pts, color, {dashed=false, alpha=1, width=2.5, handles=false} = {}) {
  if (!pts || pts.length < 1) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash(dashed ? [6, 5] : []);
  ctx.beginPath();
  ctx.moveTo(pts[0][0]*cv.width, pts[0][1]*cv.height);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0]*cv.width, pts[i][1]*cv.height);
  if (pts.length >= 2) ctx.stroke();
  if (handles) {
    ctx.setLineDash([]);
    for (const [x,y] of pts) {
      ctx.beginPath();
      ctx.arc(x*cv.width, y*cv.height, 4.5, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.strokeStyle = color;
    }
  }
  ctx.restore();
}

function redraw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  if (state.image) ctx.drawImage(state.image, 0, 0, cv.width, cv.height);
  const showEv = document.getElementById("showEvidence").checked;
  const showIm = document.getElementById("showImport").checked;
  if (showEv && state.evidence) {
    for (const name of LINES) {
      const pts = state.evidence[name];
      if (pts && pts.length >= 2) drawPoly(pts, COLORS[name], {dashed:true, alpha:0.45, width:2});
    }
  }
  if (showIm && state.label) {
    for (const name of LINES) {
      const polys = state.label[name] || [];
      for (const poly of polys) {
        drawPoly(poly, COLORS[name], {alpha: name===state.tag?1:0.75, width: name===state.tag?3:2, handles: name===state.tag});
      }
    }
    const mask = (state.label.hand_mask || [])[0];
    if (mask && mask.length) {
      drawPoly(mask, COLORS.hand_mask, {alpha:0.9, width:2, handles: state.tag==="hand_mask"});
      if (mask.length >= 3) {
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = COLORS.hand_mask;
        ctx.beginPath();
        ctx.moveTo(mask[0][0]*cv.width, mask[0][1]*cv.height);
        for (let i=1;i<mask.length;i++) ctx.lineTo(mask[i][0]*cv.width, mask[i][1]*cv.height);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  }
  updateReadout();
}

async function loadIndex(i) {
  if (state.dirty && !confirm("Unsaved changes — discard?")) return;
  state.index = Math.max(0, Math.min(i, state.items.length - 1));
  const it = state.items[state.index];
  if (!it) return;
  setStatus("loading…");
  const res = await fetch("/api/item/" + encodeURIComponent(it.stem));
  const data = await res.json();
  if (!res.ok) { setStatus(data.error || "load failed", "err"); return; }
  state.stem = data.stem;
  state.label = data.label;
  state.evidence = data.evidence_lines || {};
  state.dirty = false;
  state.imageUrl = data.image_url;
  const img = new Image();
  img.onload = () => { state.image = img; imgToCanvas(); redraw(); renderGallery(); setStatus(""); };
  img.onerror = () => setStatus("image failed", "err");
  img.src = data.image_url;
}

async function refreshList(keepStem) {
  const res = await fetch("/api/items");
  const data = await res.json();
  state.items = data.items || [];
  let idx = 0;
  if (keepStem) {
    const j = state.items.findIndex(x => x.stem === keepStem);
    if (j >= 0) idx = j;
  } else {
    const j = state.items.findIndex(x => !x.reviewed);
    if (j >= 0) idx = j;
  }
  renderGallery();
  if (state.items.length) await loadIndex(idx);
  else setStatus("no images", "err");
}

async function save() {
  if (!state.stem || !state.label) return;
  const body = {
    space: state.label.space || "image_norm",
    source: state.label.source || "annotator",
    heart: state.label.heart || [],
    head: state.label.head || [],
    life: state.label.life || [],
    fate: state.label.fate || [],
    hand_mask: state.label.hand_mask || [],
  };
  const res = await fetch("/api/save/" + encodeURIComponent(state.stem), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) { setStatus(data.error || "save failed", "err"); return; }
  state.dirty = false;
  state.label.reviewed = true;
  setStatus("saved · " + data.path, "ok");
  const it = state.items[state.index];
  if (it) it.reviewed = true;
  renderGallery();
  updateReadout();
}

function setTag(tag) {
  state.tag = tag;
  document.querySelectorAll("#tags button").forEach(b => b.classList.toggle("on", b.dataset.tag === tag));
  redraw();
}

function markAbsent() {
  const key = activePolyKey();
  state.label[key] = [];
  state.dirty = true;
  redraw();
}

function undoPoint() {
  const key = activePolyKey();
  const poly = ensurePoly(key);
  if (poly.length) { poly.pop(); state.dirty = true; }
  if (poly.length === 0) state.label[key] = [];
  redraw();
}

function clearActive() {
  markAbsent();
}

cv.addEventListener("mousedown", (e) => {
  if (!state.label) return;
  const [nx, ny] = normFromEvent(e);
  const hit = hitHandle(nx, ny);
  if (hit) {
    state.drag = hit;
    setTag(hit.line === "hand_mask" ? "hand_mask" : hit.line);
    return;
  }
  const key = activePolyKey();
  const poly = ensurePoly(key);
  poly.push([nx, ny]);
  state.dirty = true;
  redraw();
});

cv.addEventListener("mousemove", (e) => {
  if (!state.drag) return;
  const [nx, ny] = normFromEvent(e);
  const {line, polyIdx, ptIdx} = state.drag;
  state.label[line][polyIdx][ptIdx] = [nx, ny];
  state.dirty = true;
  redraw();
});

window.addEventListener("mouseup", () => { state.drag = null; });

document.getElementById("showImport").onchange = redraw;
document.getElementById("showEvidence").onchange = redraw;
document.querySelectorAll("#tags button").forEach(b => b.onclick = () => setTag(b.dataset.tag));
document.getElementById("btnAbsent").onclick = markAbsent;
document.getElementById("btnUndo").onclick = undoPoint;
document.getElementById("btnClear").onclick = clearActive;
document.getElementById("btnPrev").onclick = () => loadIndex(state.index - 1);
document.getElementById("btnNext").onclick = () => loadIndex(state.index + 1);
document.getElementById("btnSave").onclick = save;

window.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea")) return;
  const k = e.key.toLowerCase();
  if (k === "1") setTag("heart");
  else if (k === "2") setTag("head");
  else if (k === "3") setTag("life");
  else if (k === "4") setTag("fate");
  else if (k === "5") setTag("hand_mask");
  else if (k === "a") markAbsent();
  else if (k === "backspace" || k === "delete") { e.preventDefault(); undoPoint(); }
  else if (k === "s") { e.preventDefault(); save(); }
  else if (k === "n") loadIndex(state.index + 1);
  else if (k === "p") loadIndex(state.index - 1);
});

window.addEventListener("resize", () => { imgToCanvas(); redraw(); });
refreshList();
</script>
</body>
</html>
