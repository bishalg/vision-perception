appId: com.open-spectrum.eye-gaze
name: bdd-03-dashboard-and-guardians
---
# Feature: longitudinal care dashboard and caregiver guardrails
#   The dashboard lists the M-CHAT-R/F questionnaire, the pediatrician report and
#   the gaze tab; on simulators the gaze capture is honestly gated by hardware.
#
# NOTE: continues the app state created by 01 + 02 (do not clear it).
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 20000

- extendedWaitUntil:
    visible: Social attention trend
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: dashboard

# The dashboard is a long lazy List; scrollUntilVisible is retried via the
# script if a lazy row is skipped between frames.
# The M-CHAT-R/F card is always present; its "Open" entry exists only in builds
# generated with MCHAT_LICENSED=1 (H3), so the survey steps are conditional.
- scrollUntilVisible:
    element: ".*M-CHAT-R/F.*"
    direction: DOWN
    visibilityPercentage: 20
    timeout: 30000
- runFlow:
    when:
      visible: Open M-CHAT-R/F
    commands:
      - tapOn: Open M-CHAT-R/F
      - waitForAnimationToEnd:
          timeout: 15000
      - takeScreenshot: mchat-survey
      - tapOn: Cancel
      - waitForAnimationToEnd:
          timeout: 10000

# Pediatrician report (toolbar action, a11y label)
- tapOn: Report for your pediatrician
- extendedWaitUntil:
    visible: Done
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: pediatrician-report
- tapOn: Done
- waitForAnimationToEnd:
    timeout: 10000

# Gaze tab — on a simulator the entry gate blocks live capture on purpose
- tapOn: Gaze
- assertVisible: This device cannot run gaze observations
# SIM-7: the hardware gate comes before any camera prompt
- assertNotVisible: ".*Would Like to Access the Camera.*"
- takeScreenshot: gaze-gate-simulator

# Settings
- tapOn: Settings
- takeScreenshot: settings

# SIM-7: calibration and camera check from Settings hit the same gate, with no
# camera prompt (these entries bypass the Gaze tab gate).
- scrollUntilVisible:
    element: Quick Calibrate
    direction: DOWN
    timeout: 20000
- tapOn: Quick Calibrate
- extendedWaitUntil:
    visible: This device cannot run gaze observations
    timeout: 10000
- assertNotVisible: ".*Would Like to Access the Camera.*"
- tapOn:
    id: unsupported-device-close
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: Camera & Distance Check
    direction: DOWN
    timeout: 20000
- tapOn: Camera & Distance Check
- extendedWaitUntil:
    visible: This device cannot run gaze observations
    timeout: 10000
- assertNotVisible: ".*Would Like to Access the Camera.*"
- tapOn:
    id: settings_camera_check_close
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Quick Calibrate
