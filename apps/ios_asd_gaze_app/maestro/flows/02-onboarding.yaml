appId: com.open-spectrum.eye-gaze
name: bdd-02-onboarding-consent-and-profile
---
# Feature: caregiver onboarding
#   Consent must be explicit before any camera use can be configured,
#   and the child profile chooses the age-appropriate stimulus battery.
#
# NOTE: continues the app state created by 01-mode-selection (do not clear it).
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 20000

- extendedWaitUntil:
    visible: Privacy & Security
    timeout: 30000

- waitForAnimationToEnd:
    timeout: 8000

- tapOn:
    id: "onboarding_consent_switch"
- takeScreenshot: onboarding-consent

- tapOn: Continue
- assertVisible: Child Profile Setup
- waitForAnimationToEnd:
    timeout: 8000

- takeScreenshot: child-profile

- tapOn:
    id: "child_name_field"
# The field pre-fills "Child"; clear it before typing the showcase name.
- eraseText
- inputText: Aarya
# The keyboard can swallow the next tap while it animates away; dismiss it with
# Return (hideKeyboard cannot dismiss this SwiftUI field), retry once if the tap
# was still swallowed, and wait for each step's title so a slow simulator never
# runs a step behind.
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

- tapOn: Continue
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: Child Profile Setup
    commands:
      - tapOn: Continue
- extendedWaitUntil:
    visible: Downloading Activities
    timeout: 15000
- takeScreenshot: activities-download

# Continue stays disabled until the activity pack resolves (network-dependent).
- extendedWaitUntil:
    visible:
      text: Continue
      enabled: true
    timeout: 60000
- tapOn: Continue
- extendedWaitUntil:
    visible: Getting Ready
    timeout: 30000
- takeScreenshot: getting-ready

- tapOn: Complete Setup & Enter App
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: Social attention trend
- takeScreenshot: dashboard
