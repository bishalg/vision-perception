appId: com.open-spectrum.eye-gaze
name: bdd-04-care-and-data-control
---
# Feature: longitudinal care and data control
#   App mode can be switched from Settings, milestones open as detail sheets,
#   the mood diary logs emotions, and data deletion is always guarded by an
#   explicit confirmation dialog.
#
# NOTE: continues the app state created by flows 01-03 (do not clear it).
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 20000

# ── App mode switching (relaunch resets to the Dashboard tab) ──

- extendedWaitUntil:
    visible: Social attention trend
    timeout: 30000
- tapOn: Settings
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: App Mode
- tapOn: Clinic / Professional
# The mode switch re-renders the tab bar; wait for it so the next tap is not lost.
- extendedWaitUntil:
    visible: Clinic Dashboard
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: settings-clinic-mode
- tapOn: Parent & Caregiver
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: Clinic Dashboard
    commands:
      - tapOn: Parent & Caregiver
- extendedWaitUntil:
    notVisible: Clinic Dashboard
    timeout: 10000

# ── Mood diary (diary card sits above the milestones section) ──

- tapOn: Dashboard
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element: Log emotion
    direction: DOWN
    visibilityPercentage: 20
    timeout: 30000
- tapOn: Log emotion
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: mood-diary
- tapOn: Close
- waitForAnimationToEnd:
    timeout: 8000

# ── Milestone detail ──

- scrollUntilVisible:
    element:
      id: milestone_row_18_cognitive
    direction: DOWN
    timeout: 60000
- takeScreenshot: milestones-section
# Rows and the sheet carry ids because "Cognitive" repeats in every age
# section. Let the list stop coasting first: a tap mid-scroll only stops it.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: milestone_row_18_cognitive
# The sheet can take a few seconds on a busy simulator; wait for its content.
- extendedWaitUntil:
    visible:
      id: milestone_detail
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: milestone-detail
- tapOn:
    id: milestone_detail_done
- waitForAnimationToEnd:
    timeout: 8000

# ── Data deletion is guarded (dialog shown, then cancelled) ──

- tapOn: Settings
- scrollUntilVisible:
    element: Delete all observation data
    direction: DOWN
    visibilityPercentage: 20
    timeout: 30000
- tapOn: Delete all observation data
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Delete observation data
- takeScreenshot: delete-data-confirm
# iOS 26+ shows this dialog as a popover with no Cancel button: tapping outside
# cancels. Use the system dismiss region, never the destructive action.
- tapOn:
    id: PopoverDismissRegion
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: Delete observation data
