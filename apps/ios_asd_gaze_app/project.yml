name: AsdGazeCollector
include:
  - path: Config/mchat-licensed.yml
    enable: ${MCHAT_LICENSED}
options:
  bundleIdPrefix: com.open-spectrum
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  DemoRelease: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone & iPad
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  CurvAsdGazeKit:
    path: ../../domains/asd_screening/ios
  CareActivityKit:
    path: CareActivityKit
  CareKit:
    url: https://github.com/carekit-apple/CareKit.git
    exactVersion: 4.1.0

targets:
  AsdGazeCollector:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        type: group
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_IDENTIFIER:default=com.open-spectrum.eye-gaze)
        PRODUCT_NAME: AsdGazeCollector
        INFOPLIST_KEY_CFBundleDisplayName: "Eye Gaze"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 6J3WY94J6T
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "1.0.0"
        GENERATE_INFOPLIST_FILE: true
        # Merged into the generated plist: array-valued keys (UIRequiredDeviceCapabilities, SIM-7).
        INFOPLIST_FILE: Config/Info-Additions.plist
        # PRV-3 / CNS-8 usage strings: plain, non-diagnostic wording (ADR-0004), checked by BuildConfigurationTests.
        # No ASDResearchStudy key: there is no research study at launch (H7, CNS-9).
        INFOPLIST_KEY_NSCameraUsageDescription: "The front camera measures where your child looks and their facial expressions while short clips play. Processing happens on this device, and photos and video are never saved. If you choose the optional age-range check, it also runs on this device."
        INFOPLIST_KEY_NSMotionUsageDescription: "Motion data separates movement of the phone from your child's head movement during an observation."
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Medication and sensory diary reminders use local notifications so caregivers can be alerted at scheduled times."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition lets you dictate diary notes. Audio is processed on this device when possible and is not saved as a recording."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The microphone is used only while you hold the dictate button for diary notes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "You can attach a photo to a diary entry. Attached photos stay on this device."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Mood diary entries can be read from State of Mind in the Health app, so you see one history across apps."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "When you log a mood in this app, it can save a State of Mind entry to the Health app."
        CODE_SIGN_ENTITLEMENTS: Resources/AsdGazeCollector.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        # App Store builds compile with the age-assurance flag; internal/Debug
        # builds bypass the Declared Age Range request entirely.
        # Simulation (ADR-0001) and the research classifier (ADR-0004) are
        # Debug-only capabilities; Release never defines them. The kit mirrors
        # these in Package.swift because OTHER_SWIFT_FLAGS does not reach SwiftPM.
        Debug:
          OTHER_SWIFT_FLAGS: "$(inherited) -DASD_SIMULATION_ENABLED -DASD_RESEARCH_CLASSIFIER -DASD_DEMO_TOOLS $(ASD_MCHAT_FLAG)"
        DemoRelease:
          OTHER_SWIFT_FLAGS: "$(inherited) -DASD_APP_STORE_AGE_ASSURANCE -DASD_DEMO_TOOLS $(ASD_MCHAT_FLAG)"
        Release:
          OTHER_SWIFT_FLAGS: "$(inherited) -DASD_APP_STORE_AGE_ASSURANCE $(ASD_MCHAT_FLAG)"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Eye Gaze AppStore"
    dependencies:
      - package: CurvAsdGazeKit
      - package: CurvAsdGazeKit
        product: AsdCore
      - package: CareActivityKit
      - package: CareKit
        product: CareKitStore
      - target: AsdGazeCareWidget
        embed: true
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: CryptoKit.framework
      - sdk: Network.framework
      - sdk: PDFKit.framework
      - sdk: UserNotifications.framework
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: Speech.framework
      - sdk: PhotosUI.framework
      - sdk: HealthKit.framework

  AsdGazeCareWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Care Alerts
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_IDENTIFIER:default=$(APP_IDENTIFIER:default=com.open-spectrum.eye-gaze).carewidget)
        PRODUCT_NAME: AsdGazeCareWidget
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "1.0.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 6J3WY94J6T
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Eye Gaze Widget AppStore"
    dependencies:
      - package: CareActivityKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework

  AsdGazeCollectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: AsdGazeCollector
      - package: CurvAsdGazeKit
      - package: CurvAsdGazeKit
        product: AsdCore
      - package: CareActivityKit
      - package: CareKit
        product: CareKitStore
      - sdk: Network.framework
      - sdk: PDFKit.framework


