name: PalmScanner
options:
  bundleIdPrefix: org.curv
  deploymentTarget:
    iOS: "16.3"
  developmentLanguage: en
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.3"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES

# Shared packages only — palm app code lives in this Xcode target.
packages:
  CurvCameraOverlayKit:
    path: ../mobile_overlay/ios
  CurvApple:
    path: ../../adapters/apple

targets:
  PalmScanner:
    type: application
    platform: iOS
    sources:
      - path: AppHost
        excludes:
          - Info.plist
      - path: Sources
      - path: ../mobile_overlay/shared/strings/palm_strings.json
        buildPhase: resources
      - path: Resources
        buildPhase: resources
        type: group
        excludes:
          - .gitkeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.curv.palmapp
        PRODUCT_NAME: PalmScanner
        # OpenCV's static core references libc++ and the Accelerate framework;
        # both must be linked explicitly for the CurvEngine native path.
        OTHER_LDFLAGS: "-lc++ -framework Accelerate"
        DEAD_CODE_STRIPPING: YES
        INFOPLIST_FILE: AppHost/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6J3WY94J6T
        IPHONEOS_DEPLOYMENT_TARGET: "16.3"
    dependencies:
      - package: CurvCameraOverlayKit
        product: CurvCameraOverlay
      - package: CurvCameraOverlayKit
        product: CurvPalmOverlay
      - package: CurvApple
        product: CurvApple
    # opencv2.xcframework is a static framework (ar archive). Xcode 16+ validates
    # frameworks in App/Frameworks/ and rejects static ones with "missing or
    # invalid CFBundleExecutable". It is already linked statically via
    # OTHER_LDFLAGS, so remove the copied bundle post-embed.
    postBuildScripts:
      - name: StripStaticOpenCVFramework
        basedOnDependencyAnalysis: false
        script: |
          echo "Stripping static opencv2.framework from Frameworks (already linked statically)..."
          rm -rf "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/opencv2.framework"
          # Re-sign the app bundle after removing the framework.
          # Use EXPANDED_CODE_SIGN_IDENTITY if set by Xcode/Fastlane, otherwise fall back to ad-hoc for simulator.
          if [ -d "${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}" ]; then
            SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            echo "Re-signing bundle with identity: ${SIGN_IDENTITY}"
            codesign --force --sign "${SIGN_IDENTITY}" --timestamp=none "${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}" 2>/dev/null || true
          fi
        runOnlyWhenInstalling: false
    info:
      path: AppHost/Info.plist
      properties:
        CFBundleDisplayName: Palm Reader
        UILaunchScreen: {}
        NSCameraUsageDescription: Camera access is required to capture your palm for real-time guidance and crease analysis.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  PalmScanner:
    build:
      targets:
        PalmScanner: all
    run:
      config: Debug
      askForAppToLaunch: false
