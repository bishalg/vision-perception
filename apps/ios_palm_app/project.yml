name: PalmScanner
options:
  bundleIdPrefix: org.curv
  deploymentTarget:
    iOS: "16.3"
  developmentLanguage: en
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.3"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES

# Shared packages only — palm app code lives in this Xcode target.
packages:
  CurvCameraOverlayKit:
    path: ../mobile_overlay/ios
  CurvApple:
    path: ../../adapters/apple

targets:
  PalmScanner:
    type: application
    platform: iOS
    sources:
      - path: AppHost
        excludes:
          - Info.plist
      - path: Sources
      - path: ../mobile_overlay/shared/strings/palm_strings.json
        buildPhase: resources
      - path: Resources
        buildPhase: resources
        type: group
        excludes:
          - .gitkeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.curv.palmapp
        PRODUCT_NAME: PalmScanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # OpenCV's static core references libc++ and the Accelerate framework;
        # both must be linked explicitly for the CurvEngine native path.
        OTHER_LDFLAGS: "-lc++ -framework Accelerate"
        DEAD_CODE_STRIPPING: YES
        INFOPLIST_FILE: AppHost/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6J3WY94J6T
        IPHONEOS_DEPLOYMENT_TARGET: "16.3"
    preBuildScripts:
      - name: RequireNativeEngine
        basedOnDependencyAnalysis: false
        script: |
          for framework in CurvEngine opencv2; do
            if [ ! -d "${SRCROOT}/../../build/${framework}.xcframework" ]; then
              echo "error: Missing ${framework}.xcframework. Build the native iOS dependencies before building PalmScanner."
              exit 1
            fi
          done
    dependencies:
      - package: CurvCameraOverlayKit
        product: CurvCameraOverlay
      - package: CurvCameraOverlayKit
        product: CurvPalmOverlay
      - package: CurvApple
        product: CurvApple
      - target: OpenCVPrivacy
        embed: true
    # opencv2.xcframework is a static framework (ar archive). Xcode 16+ validates
    # frameworks in App/Frameworks/ and rejects static ones with "missing or
    # invalid CFBundleExecutable". It is already linked statically via
    # OTHER_LDFLAGS, so remove the copied bundle post-embed.
    postBuildScripts:
      - name: StripStaticOpenCVFramework
        basedOnDependencyAnalysis: false
        script: |
          if [ -d "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/opencv2.framework" ]; then
            echo "Stripping static opencv2.framework from Frameworks (already linked statically)..."
            rm -rf "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/opencv2.framework"
            if [ -d "${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}" ]; then
              SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
              echo "Re-signing bundle with identity: ${SIGN_IDENTITY}"
              codesign --force --sign "${SIGN_IDENTITY}" --timestamp=none "${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}" 2>/dev/null || true
            fi
          fi
        runOnlyWhenInstalling: false
    info:
      path: AppHost/Info.plist
      properties:
        CFBundleDisplayName: Palm Reader
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        NSCameraUsageDescription: Camera access is required to capture your palm for real-time guidance and crease analysis.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  OpenCVPrivacy:
    type: bundle
    platform: iOS
    sources:
      - path: ../../third_party/ios/opencv-src-4.11.0/platforms/ios/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.opencv.privacy
        SKIP_INSTALL: YES
  PalmScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PalmScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.curv.palmapp.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PalmScanner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PalmScanner"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PalmScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PalmScannerUITests
    dependencies:
      - target: PalmScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.curv.palmapp.uitests
        TEST_TARGET_NAME: PalmScanner
schemes:
  PalmScanner:
    build:
      targets:
        PalmScanner: all
    run:
      config: Debug
      askForAppToLaunch: false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PalmScannerTests
        - PalmScannerUITests
