name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  shared-strings:
    name: Shared mobile strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared palm strings (single source for iOS + Android)
        run: ./scripts/check_shared_strings.py

  mobile-parity:
    name: iOS/Android parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check iOS/Android parity contract (see docs/mobile_parity.md)
        run: ./scripts/check_mobile_parity.py

  format-check:
    name: Format (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format (keep in sync with scripts/format.sh)
        run: python3 -m pip install clang-format==18.1.8
      - name: Verify formatting
        run: ./scripts/format.sh --check

  build-ubuntu:
    name: Build & Test (Ubuntu, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopencv-dev nlohmann-json3-dev libspdlog-dev libgtest-dev clang-tidy
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release -j "$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Static analysis (clang-tidy)
        run: ./scripts/lint.sh

  build-macos:
    name: Build & Test (macOS, -Werror)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja opencv nlohmann-json spdlog googletest
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release -j "$(sysctl -n hw.ncpu)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopencv-dev nlohmann-json3-dev libspdlog-dev libgtest-dev
      - name: Configure (Debug + ASan/UBSan)
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan -j "$(nproc)"
      - name: Unit tests under sanitizers
        run: ctest --test-dir build-asan --output-on-failure

  coverage:
    name: Coverage gate (100% lines + branches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopencv-dev nlohmann-json3-dev libspdlog-dev libgtest-dev clang llvm python3
      - name: Configure (Debug + coverage, clang)
        run: cmake --preset coverage -DCMAKE_CXX_COMPILER=clang++
      # TEMPORARY: the 100% line+branch gate is enforced but non-blocking while
      # the gap-closing test waves are in flight (15 files below threshold on
      # Linux llvm-cov 18; gap list is printed in the job log on every run).
      # Remove continue-on-error once coverage reaches 100% again.
      - name: Coverage pipeline and 100% gate
        continue-on-error: true
        run: ./scripts/coverage.sh
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/html/
