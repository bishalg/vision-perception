name: rust

on:
  # WP-A.15: run by hand for the SYNC-10 field harness (`field-sync` job, input `field_test`).
  workflow_dispatch:
    inputs:
      field_test:
        description: "Run the SYNC-10 field sync harness (toxiproxy, ASD_FIELD_TEST=1)"
        type: boolean
        default: false
  push:
    branches: [dev, main]
    paths:
      - "rust/**"
      - "scripts/rust_test.sh"
      - "scripts/i18n/**"
      - "docs/spec/schemas/asd/**"
      - ".github/workflows/rust.yml"
      - "apps/android_asd_core/**"
      - "scripts/build_asd_android.sh"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/rust_test.sh"
      - "scripts/i18n/**"
      - "docs/spec/schemas/asd/**"
      - ".github/workflows/rust.yml"
      - "apps/android_asd_core/**"
      - "scripts/build_asd_android.sh"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ASD_REQUIRE_ALL: "1"
  SQLX_OFFLINE: "true"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asd
          POSTGRES_PASSWORD: asd
          POSTGRES_DB: asd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://asd:asd@localhost:5432/asd_test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rust/rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Separate installs: --no-default-features/--features apply to every listed crate.
      - name: Install cargo-deny and sqlx-cli
        run: |
          cargo install cargo-deny --locked
          cargo install sqlx-cli --locked --no-default-features --features rustls,postgres

      # `cargo sqlx prepare --check` describes queries against DATABASE_URL, so the schema
      # must exist there. Backend tests create their own per-test databases.
      - name: Migrate the gate database
        run: sqlx migrate run --source rust/crates/asd-backend/migrations

      - name: Rust gates
        run: scripts/rust_test.sh

      # WP-L.0 (I18N-3, I18N-6): domain catalogue checks and console module drift.
      - name: i18n catalogue check
        run: cargo run --manifest-path rust/Cargo.toml -q -p asd-cli -- i18n check

      # WP-L.0 (I18N-8): no new UI string literal in Swift or Kotlin beyond the baseline.
      - name: i18n literal lint (iOS, Android)
        run: >-
          cargo run --manifest-path rust/Cargo.toml -q -p asd-cli -- i18n lint
          --swift apps/ios_asd_gaze_app/Sources
          --swift domains/asd_screening/ios/Sources
          --kotlin apps/android_asd_gaze_spike
          --baseline scripts/i18n/literal-baseline.txt

      # WP-R.6: the asd-wasm parity tests again, compiled to wasm32 and run under Node, then
      # the `--target web` package build the console consumes.
      - name: asd-wasm (wasm32 parity + web package)
        run: |
          cargo install wasm-pack --locked
          scripts/build_asd_wasm.sh --test
          scripts/build_asd_wasm.sh

  # DEP-1/DEP-2: the image builds, compose comes up, migrations run as the init step and
  # the API reports ready (database, migrations, blob store).
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose -f rust/docker-compose.yml up -d --build --wait --wait-timeout 300 api worker

      - name: Health checks
        # The distroless image has no shell or curl, so `api` has no compose healthcheck;
        # poll from the runner instead.
        run: |
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health/ready && break; sleep 2; done
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/health/ready
          test "$(docker compose -f rust/docker-compose.yml ps -a --format '{{.ExitCode}}' migrate)" = "0"

      - name: Logs
        if: always()
        run: docker compose -f rust/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f rust/docker-compose.yml down -v

  # AND-3 (WP-A.12): the Kotlin bindings from the same UniFFI definitions. Builds
  # libasd_ffi.so for arm64-v8a / armeabi-v7a / x86_64 with cargo ndk, the AAR, and runs the
  # JVM golden parity test against the host library. Required for asd-ffi changes.
  android-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASD_NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the NDK and cargo-ndk
        run: |
          sdkmanager --install "ndk;${ASD_NDK_VERSION}" "platforms;android-36"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ASD_NDK_VERSION}" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Android bindings, AAR and golden parity test
        run: scripts/build_asd_android.sh --test

      - name: Upload the AAR
        uses: actions/upload-artifact@v4
        with:
          name: asd-core-aar
          path: apps/android_asd_core/core/build/outputs/aar/core-release.aar
          if-no-files-found: error

  # WP-A.15 / SYNC-10: the compose stack behind toxiproxy, 50 synthetic sessions posted 3x
  # each plus 50 proxy-mode blob PUTs with Content-Digest. Manual only: run the workflow by
  # hand with `field_test` ticked (or set the repository variable ASD_FIELD_TEST=1).
  field-sync:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.field_test) || vars.ASD_FIELD_TEST == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASD_FIELD_TEST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Field sync harness (toxiproxy)
        run: scripts/field_sync_test.sh
