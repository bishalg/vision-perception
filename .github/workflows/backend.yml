name: ASD Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'services/asd_backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'services/asd_backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Test & Lint ASD Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/asd_backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Alembic migration check
        run: |
          alembic upgrade head

      - name: Run Pytest suite
        run: |
          pytest tests/ -v
